name: Update Database
# Hourly official FPL snapshot + pinned GitHub archives. Only Actions writes;
# Vercel serves the committed bundle and never persists refresh output.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # hourly

concurrency:
  group: update-database-${{ github.ref }}
  cancel-in-progress: false

env:
  NO_COLOR: true
  CI: 1

jobs:
  restore:
    name: Update Database
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: endsWith(github.ref, '/main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Install sqlite
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Update Database
        run: bun scripts/getLatestFPLDatabase.mjs

      - name: Commit and push
        run: |
          git config user.name "Divyendu Singh (Bot)"
          git config user.email "divyendu.z@gmail.com"
          git add public/assets/fpl.db app/data/fpl.json
          if git diff --cached --quiet; then
            echo "Database unchanged, nothing to commit"
            echo "No data or coverage changes; bundle and manifest retained." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "[skip ci] Update Database"
          git pull --rebase origin main
          git push
