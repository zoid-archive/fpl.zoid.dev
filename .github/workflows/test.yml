name: Run Tests
# This workflow is triggered on pushes to the repository.
on:
  push:
  workflow_dispatch:

env:
  NO_COLOR: true
  CI: 1

jobs:
  build:
    name: Test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        # better-sqlite3 (transitive via electric-sql) cannot build against the
        # runner Node ABI, and nothing in this repo loads it.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Tests
        run: bun run test
